section6:
  title: Voices of Resurrection
  testimonials:
    - name: Brett S.
      testimonial: >-
        Since coming to Resurrection, we not only found a church but a true
        family. We have also encountered the Lord in a very real and powerful
        way. Through the Eucharist and the Prayer Book in particular, my life
        has been deeply transformed. I am so grateful to be a part of this
        community.
    - name: Tara S.
      testimonial: >-
        I’m so happy to have finally found a church home where I know I will
        meet God every Sunday through meaningful worship, prayer, and teaching.
    - name: Kate O.
      testimonial: >-
        Resurrection Anglican church is our family. We found this community when
        we first moved to the area and were welcomed with such warmth. Now, 4
        years later we continue to be so grateful for the way the leadership has
        loved and shepherded us, for the ways this community has shaped our
        family in Christlikeness. In a world where it feels like so many of us
        are divided, I praise God for his faithfulness in holding together his
        body at Resurrection. I love looking around on a Sunday after worship,
        or an ordinary Tuesday where we’re living life together and watching
        this body love each other well - especially our children who are growing
        up in this church, surrounded by people who are all different from each
        other but united at the table of our Lord.
    - name: David R.
      testimonial: >-
        The rhythm of Scripture, prayer, and the Lord’s Table has renewed my
        faith and anchored our family.
    - name: Emily C.
      testimonial: >-
        There’s a beauty and peace in the worship here that slows my heart and
        reminds me of what really matters.
    - name: James W.
      testimonial: >-
        Resurrection has grounded us in historic Christianity while helping us
        live out our faith in everyday life.
