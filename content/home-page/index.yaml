section6:
  title: Voices of Resurrection
  testimonials:
    - name: Suzie B.
      testimonial: >-
        At Resurrection, we found a home. This has become our family, and every
        Sunday feels like coming back to something steady, beautiful, and full
        of grace.
    - name: '"Michael T.'
      testimonial: >-
        The liturgy has shaped my faith in ways I didn’t expect. It’s deep,
        reverent, and rooted in something far bigger than myself.
    - name: Karen L.
      testimonial: >-
        From our first visit, we felt welcomed. Resurrection is more than a
        service — it’s a community that truly walks together.
    - name: David R.
      testimonial: >-
        The rhythm of Scripture, prayer, and the Lord’s Table has renewed my
        faith and anchored our family.
    - name: Emily C.
      testimonial: >-
        There’s a beauty and peace in the worship here that slows my heart and
        reminds me of what really matters.
    - name: James W.
      testimonial: >-
        Resurrection has grounded us in historic Christianity while helping us
        live out our faith in everyday life.
